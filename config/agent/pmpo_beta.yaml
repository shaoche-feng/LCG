defaults:
  - default
  - _self_

actor_critic:
  _target_: models.pmpo_beta.PMPOBetaConfig
  img_channels: ${agent.denoiser.inner_model.img_channels}
  img_size: ${env.train.size}
  channels: [32,32,64,64]
  down: [1,1,1,1]
  frame_stack: 4
  actor_hidden_dims: [256, 256]
  value_hidden_dims: [256, 256]
  actor_lr: 1e-4
  value_lr: 1e-4
  # Retain DIAMOND's discount/trace defaults, rather than silently changing them.
  gamma: 0.985
  lambda_: 0.95
  # Dreamer 4 Eq. 11; KL and log probabilities sum action dimensions, in nats.
  alpha_pmpo: 0.5
  beta_kl: 0.3
  # Stage 3 entropy-bonus experiment (frozen 100k baseline used 0.0, i.e. no entropy
  # term at all -- see the plateau/over-concentration investigation on
  # branch pmpo-beta-continuous). 0.0 is bit-identical to the baseline actor loss.
  entropy_coef: 0.01
  # Actor objective: sign (default; Eq. 11, no magnitude weighting) or advantage_weighted
  # (log-probabilities weighted by min(cap, |A| / mean |A|) within each sign group; KL, entropy
  # and critic unchanged). The cap of 5 is an engineering choice, not a validated optimum.
  # Exploration presets select advantage_weighted; downstream training states sign explicitly.
  actor_objective: sign
  advantage_weight_cap: 5.0
  # Gaussian H10 EMA-critic controller, from the reference run folder
  # kingplus0:/home/bigking/scfeng/LCG-stage3-gaussian-h10-emacritic (a13b57c + its working tree;
  # run overrides actor_distribution=tanh_gaussian, slow_critic_coef=1.0, world_model_env.horizon=10).
  # tanh_gaussian: diagonal Gaussian over pre-tanh actions, std = 0.1 + 0.9 * sigmoid, squashed by
  # tanh to the action bounds (beta: the earlier Beta actor). See PMPOBetaConfig.
  actor_distribution: tanh_gaussian
  # Slow EMA critic regularization: value_loss += coef * MSE(V, sg(V_slow)); after every critic
  # step V_slow = (1 - rate) V_slow + rate V. The online critic gives the bootstraps and advantages.
  slow_critic_coef: 1.0
  slow_critic_rate: 0.02
  # Imagined resets: the policy's frame stack repeats the start frame (the reference's convention;
  # the world model keeps its real replay prompt). replay_prompt: the stack starts from the prompt.
  imagination_history: repeat_anchor
  # Snapshot before updates 0,500,1000,...; held fixed for 500 fresh-rollout updates.
  # A moving prior refreshed every 10 updates was validated to collapse (beta
  # concentration runaway, entropy collapse, action-boundary drift, near-state-
  # independent policy); 500 is the validated, characterized configuration -- see
  # docs/pmpo_beta/k4_implementation.md and the fixed-prior/refresh-500/full-loop
  # diagnostic runs on branch pmpo-beta-continuous.
  prior_refresh_interval: 500
  concentration_min: 1.0
  imagination_horizon: ${world_model_env.horizon}
  max_grad_norm: 10.0
  seed: ${oc.select:common.seed,0}
  log_diagnostics: false  # print every update's metrics as JSON on the terminal
  # Detailed per-update metrics under actor_critic/train/debug/ (computed only when true; logging
  # only, training is identical). The PMPO diagnostic mode turns it on.
  debug_metrics: false
