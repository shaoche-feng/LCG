# Shared exploration settings: the selected 100k schedule for every method. Method choices are in
# config/experiment/<method>_100k.yaml, scoring settings in config/intrinsic_reward/; launch scripts set the
# domain and task group (env.train.domain_name / task_names), seed, device, output folder and W&B identity.
defaults:
  - _self_
  - env: dm_control
  - agent: pmpo_beta
  - intrinsic_reward: lcg


hydra:
  job:
    chdir: True
  # Default run folder: outputs/<method>/<domain>/seed_<exploration seed>, relative to the launch directory.
  # <method>: uniform, lcg, full-ensemble, laplace-ensemble or plan2explore (exploration_trainer.OUTPUT_LABELS),
  # from intrinsic_reward.enabled/method; <domain> and the seed are the configured env.train.domain_name and
  # common.seed (which must be set). A folder that already holds run outputs is refused unless common.resume.
  # Custom output roots: pending (hydra.run.dir can still be overridden).
  run:
    dir: ${exploration_run_dir:${intrinsic_reward.enabled},${oc.select:intrinsic_reward.method,lcg},${env.train.domain_name},${common.seed}}

wandb:
  mode: disabled
  project: null
  entity: null
  name: null
  group: null
  tags: null
  notes: null
  id: null  # null: a new run id, kept in the run folder's wandb_run.json so a resume continues that run

# Exploration terminal output (configs without this section use these values).
logging:
  progress: bar  # bar: standard tqdm bars (phase, %, counts, elapsed, remaining, rate); none: no progress output
  epoch_summary: true  # one W&B row per epoch with the progress/* counters and timing/* (not shown on the terminal)
  # Mirror every W&B row to wandb_history.jsonl in the run folder; a resume re-logs committed rows
  # the W&B server never received (e.g. a hard crash that also killed the upload process).
  local_history: true

initialization:
  path_to_ckpt: null
  load_denoiser: True
  load_rew_end_model: False  # exploration builds no reward/end model
  load_actor_critic: True

common:
  devices: 0  # int, list of int, cpu, or all 
  seed: null
  resume: False # do not modify, set by scripts/resume.sh only.

checkpointing:
  save_agent_every: 5
  num_to_keep: 11  # number of checkpoints to keep, use null to disable

# Downstream milestones (milestones/steps_NNNNNN/), published at epoch boundaries. Selected setting:
# 20 milestones per 100k run, all kept: 5,500 (epoch 1) and every 5,000 replay steps from 10,000 (epoch 10)
# to 100,000 (epoch 190), the 5,000 initial steps included; each is an epoch boundary of the schedule
# below. Downstream adapts ten of them (config/experiment/downstream_10_milestones.yaml).
milestones:
  at_steps: [5500, 10000, 15000, 20000, 25000,
             30000, 35000, 40000, 45000, 50000,
             55000, 60000, 65000, 70000, 75000,
             80000, 85000, 90000, 95000, 100000]  # publish at the first epoch boundary reaching each count
  every_steps: null  # also publish every N real steps (null: off)
  keep_last: null  # keep only the newest N milestones (null: keep all)

collection:
  train:
    num_envs: 1
    epsilon: 0.01
    # 100,000 training env steps: 5,000 initial uniform steps, then 190 collection epochs of 500.
    num_steps_total: 100000
    first_epoch:
      min: 5000  # Initial collection budget for continuous rewards.
      mode: uniform  # uniform: independent uniform actions in bounds, policy never evaluated; or policy
    # After the initial budget: policy = learned exploration (needs intrinsic_reward.enabled),
    # uniform = uniform-random baseline (no policy updates; intrinsic_reward.enabled=false).
    mode: policy
    steps_per_epoch: 500
    # Store each frame's MuJoCo qpos/qvel in the training episodes (Episode.physical_state), for
    # coverage analysis only: never read by training, scoring or downstream adaptation.
    record_physical_state: true
  test:
    num_envs: 1
    num_episodes: 4  # per periodic diagnostic (evaluation.every)
    epsilon: 0.0
    num_final_episodes: 30  # the separate final diagnostic
    record_physical_state: false  # test (evaluation) episodes

static_dataset:
  path: null  # if specified, will disable train/test data collection
  ignore_sample_weights: True

training:
  should: True
  num_final_epochs: 0  # training-only epochs after collection ends (none in the selected 100k experiment)
  cache_in_ram: True
  num_workers_data_loaders: 0
  compile_wm: True

# Exploration test diagnostics (denoiser test loss, per-task test returns, test counts).
evaluation:
  should: True  # False: no periodic or final test collection or diagnostics
  every: 10  # epochs between diagnostics (positive integer); a final one follows training
  # True: collect fresh test episodes (collection.test) before each diagnostic.
  # False: reuse the existing test dataset, collecting nothing (it must be non-empty).
  # Configs without this key use True (the earlier behaviour). Static datasets never collect.
  collect_test: True
  # Fixed env reset seeds, one test episode per seed (null: a random seed per collection, the
  # earlier behaviour). reset_seeds needs collection.test.num_episodes equal to its length,
  # final_reset_seeds likewise num_final_episodes; both need collection.test.num_envs=1.
  reset_seeds: [3001, 3002, 3003, 3004]
  final_reset_seeds: [3001, 3002, 3003, 3004, 3005, 3006, 3007, 3008, 3009, 3010,
                      3011, 3012, 3013, 3014, 3015, 3016, 3017, 3018, 3019, 3020,
                      3021, 3022, 3023, 3024, 3025, 3026, 3027, 3028, 3029, 3030]
  # Score the test episodes with the current frozen intrinsic scorer (learned methods; results in
  # evaluation/*.json and W&B). Intrinsic returns are in method-specific units.
  intrinsic: True

world_model_env:
  _target_: envs.WorldModelEnvConfig
  horizon: 10  # imagination horizon of the Gaussian H10 EMA-critic controller (reference H10 runs)
  num_batches_to_preload: 256
  diffusion_sampler:
    _target_: models.diffusion.DiffusionSamplerConfig
    num_steps_denoising: 3
    sigma_min: 2e-3
    sigma_max: 5.0
    rho: 7
    order: 1  # 1: Euler, 2: Heun
    s_churn: 0.0  # Amount of stochasticity
    s_tmin: 0.0
    s_tmax: ${eval:'float("inf")'}
    s_noise: 1.0

denoiser:
  training:
    num_autoregressive_steps: 1
    start_after_epochs: 0
    steps_first_epoch: 10000
    steps_per_epoch: 400
    sample_weights: [0.1, 0.1, 0.1, 0.7]
    batch_size: 32
    grad_acc_steps: 1
    lr_warmup_steps: 100
    max_grad_norm: 1.0

  optimizer:
    lr: 1e-4
    weight_decay: 1e-2
    eps: 1e-8
  
  sigma_distribution: # log normal distribution for sigma during training
    _target_: models.diffusion.SigmaDistributionConfig
    loc: -0.4
    scale: 1.2
    sigma_min: 2e-3
    sigma_max: 20

# Reward/end model training settings: for the future downstream trainer; unused by
# ExplorationTrainer, which builds no reward/end model.
rew_end_model:
  training:
    seq_length: ${eval:'${world_model_env.horizon} + ${agent.denoiser.inner_model.num_steps_conditioning}'}
    start_after_epochs: 0
    steps_first_epoch: 10000
    steps_per_epoch: 400
    sample_weights: ${denoiser.training.sample_weights}
    batch_size: 32
    grad_acc_steps: 1
    lr_warmup_steps: 100
    max_grad_norm: 100.0

  optimizer:
    lr: 1e-4
    weight_decay: 1e-2
    eps: 1e-8

actor_critic:
  training:
    sample_weights: ${denoiser.training.sample_weights}
    batch_size: 32
    grad_acc_steps: 1
    start_after_epochs: 0
    # PMPO updates per epoch, shared by the learned exploration methods (uniform builds no
    # policy optimizer and performs none).
    steps_first_epoch: 200
    steps_per_epoch: 200
    lr_warmup_steps: 100
    max_grad_norm: 100.0

# LCG intrinsic-reward lifecycle config now lives in config/intrinsic_reward/lcg.yaml
# (a Hydra config group, selected above via `defaults: - intrinsic_reward: lcg`), so a
# future baseline (RND, ICM, ...) can be added as a sibling file and swapped in the same
# way. Access as cfg.intrinsic_reward.* (was cfg.lcg.*).
