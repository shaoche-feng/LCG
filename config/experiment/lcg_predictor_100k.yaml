# @package _global_
# Predictor-based LCG: one denoiser and one MAP feature predictor with a diagonal Laplace precision over all
# its parameters; PMPO trains on the predictor's LCG score. Settings: config/intrinsic_reward/LCG_predictor.yaml.
# Schedule, milestones and diagnostics: config/exploration.yaml.
#
#   python src/exploration_main.py +experiment=lcg_predictor_100k env.train.domain_name=<domain> \
#       "env.train.task_names=[<tasks>]" common.seed=<seed> common.devices=<gpu> [hydra.run.dir=<run folder>]
# On Linux/EGL also set MUJOCO_GL=egl MUJOCO_EGL_DEVICE_ID=<device>. Resume a run with
# scripts/resume.sh <run folder>.
defaults:
  - override /intrinsic_reward: LCG_predictor

# Advantage-weighted PMPO (cap 5), as in every learned exploration preset.
agent:
  actor_critic:
    actor_objective: advantage_weighted
    advantage_weight_cap: 5.0

# Feature extraction inside imagination is validated uncompiled (as for Plan2Explore).
training:
  compile_wm: false
