# @package _global_
# Step 6 LCG exploration baseline (ExplorationTrainer with the existing LCG scorer and PMPO).
#
#   python src/exploration_main.py +experiment=walker_lcg_100k common.devices=0 common.seed=0 \
#       hydra.run.dir=outputs/<run name>
# On Linux/EGL also set MUJOCO_GL=egl MUJOCO_EGL_DEVICE_ID=<device>. Resume a run with
# scripts/resume.sh <run folder>. Any value below can be overridden on the command line.
#
# Same training-data budget, collection schedule, denoiser schedule, milestones and test
# diagnostics as walker_uniform_100k: 5,000 uniform initial steps, then 190 epochs of 500
# steps collected by the exploration policy = 100,000 environment steps (200,000 simulator
# control steps at action_repeat=2). Test collection is extra and counted separately.
# PMPO trains on the LCG score of imagined transitions only (no task reward), with the
# scorer refreshed once per epoch on that epoch's denoiser and replay.

env:
  train:
    domain_name: walker
    task_names: [stand, walk, run]

collection:
  train:
    num_envs: 1
    first_epoch:
      min: 5000
      mode: uniform  # independent uniform actions; the policy is never evaluated
    mode: policy  # learned (LCG) exploration after the initial collection
    steps_per_epoch: 500
    num_steps_total: 100000

evaluation:  # diagnostics retained: fresh test episodes every 10 epochs and after training
  should: true
  every: 10
  collect_test: true

# Exploration controller: the Gaussian H10 EMA-critic controller (config/agent/pmpo_beta.yaml)
# with advantage-weighted PMPO, as in the ensemble, Plan2Explore and Laplace presets.
agent:
  actor_critic:
    actor_objective: advantage_weighted
    advantage_weight_cap: 5.0

intrinsic_reward:
  enabled: true
  theta_s:
    # R1: the first ResBlock of the last decoder level. Guards fail at startup if the
    # architecture gives a different block (expected: 10 tensors, 217,664 scalars).
    include: ["unet.u_blocks.3.resblocks.0.*"]
    exclude: []
    expected_num_tensors: 10
    expected_dim: 217664
  candidate_num_mc: 5  # candidate MC probes (forward JVP, Full CRN)
  candidate_chunk_size: 32  # fastest of 16/32/64 on the RTX 5090 (1.90 / 1.60 / 1.70 s per 480 candidates); scores do not depend on it
  precision_reference_size: 320  # historical reference transitions
  precision_num_mc: 3  # historical MC probes
  damping: 1e-4
  beta: 1.0
  # Policy reward = raw LCG score / 100: no running statistics, centering or clipping.
  reward_scaling: fixed
  fixed_divisor: 100.0
  rms_enabled: false

common:
  seed: 0

wandb:
  mode: online
  project: lcg-reward-free
  name: walker-lcg-100k
