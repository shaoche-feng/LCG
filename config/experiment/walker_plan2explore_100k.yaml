# @package _global_
# Step 6 Plan2Explore-style baseline (lightweight feature-predictor ensemble disagreement):
# ExplorationTrainer with one denoiser and 5 bootstrapped next-feature predictor heads; PMPO
# trains on their disagreement. Settings: config/intrinsic_reward/plan2explore_disagreement.yaml.
#
#   python src/exploration_main.py +experiment=walker_plan2explore_100k common.devices=0 common.seed=0 \
#       hydra.run.dir=outputs/<run name>
# On Linux/EGL also set MUJOCO_GL=egl MUJOCO_EGL_DEVICE_ID=<device>. Resume a run with
# scripts/resume.sh <run folder>. Any value can be overridden, e.g. intrinsic_reward.num_members=5
# or intrinsic_reward.feature_layers=[unet.u_blocks.2].
#
# Same training-data budget, collection schedule, denoiser schedule, milestones and test
# diagnostics as walker_uniform_100k / walker_lcg_100k / walker_ensemble_100k. The controller
# matches walker_ensemble_100k (advantage-weighted PMPO, cap 5, as in the LCG online pilot; the
# repository default and walker_lcg_100k stay sign-only). World-model compilation is off.
defaults:
  - override /intrinsic_reward: plan2explore_disagreement

env:
  train:
    domain_name: walker
    task_names: [stand, walk, run]

collection:
  train:
    num_envs: 1
    first_epoch:
      min: 5000
      mode: uniform
    mode: policy
    steps_per_epoch: 500
    num_steps_total: 100000

evaluation:
  should: true
  every: 10
  collect_test: true

agent:
  actor_critic:
    actor_objective: advantage_weighted
    advantage_weight_cap: 5.0

training:
  compile_wm: false

common:
  seed: 0

wandb:
  mode: online
  project: lcg-reward-free
  name: walker-plan2explore-100k
