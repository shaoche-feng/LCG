# @package _global_
# Step 6 full diffusion-world-model ensemble baseline (MAX-inspired ensemble disagreement):
# ExplorationTrainer with 5 independently initialized, bootstrapped denoisers and PMPO on their
# disagreement.
#
#   python src/main.py +experiment=walker_ensemble_100k common.devices=0 common.seed=0 \
#       hydra.run.dir=outputs/<run name>
#
# Member count and bootstrap are intrinsic_reward settings (defaults 5 and true, from
# config/intrinsic_reward/ensemble_disagreement.yaml), e.g. intrinsic_reward.num_members=5.
#
# Same training-data budget, collection schedule, per-member denoiser schedule, milestones and
# test diagnostics as walker_uniform_100k / walker_lcg_100k. The PMPO actor objective is the
# advantage-weighted one used in the LCG online pilot (cap 5); the repository default stays
# sign-only. Every member trains the per-epoch denoiser schedule, so the ensemble performs
# `members` times the denoiser updates of a single-denoiser run (not equal training compute).
defaults:
  - override /intrinsic_reward: ensemble_disagreement

env:
  train:
    domain_name: walker
    task_names: [stand, walk, run]

collection:
  train:
    num_envs: 1
    first_epoch:
      min: 5000
      mode: uniform
    mode: policy
    steps_per_epoch: 500
    num_steps_total: 100000

evaluation:
  should: true
  every: 10
  collect_test: true

agent:
  actor_critic:
    actor_objective: advantage_weighted
    advantage_weight_cap: 5.0

training:
  compile_wm: false  # ensemble imagination runs uncompiled

common:
  seed: 0

wandb:
  mode: online
  project: lcg-reward-free
  name: walker-ensemble-100k
