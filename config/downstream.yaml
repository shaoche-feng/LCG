# Downstream training on a frozen exploration milestone (Step 5):
#   train:    python src/downstream_main.py initialization.milestone_path=<run>/milestones/steps_N \
#                 downstream.task_name=walk downstream.seed=0
#   resume:   the same command with downstream.mode=resume (same settings; the run folder may move)
#   evaluate: the same command with downstream.mode=evaluate (a completed output's final policy)
#   folder:   initialization.milestones_dir=<run>/milestones instead of milestone_path: every milestone
#             in the folder, in collection order, one independent run (child process) each; train only.
#             The ten selected milestones: +experiment=downstream_10_milestones initialization.milestones_dir=...
# Outputs: <run>/downstream/steps_N/<task>/seed_<seed>/ (never overwritten); training runs in
# .seed_<seed>.tmp/ beside it. Every adaptation trains a fresh reward predictor (5,000 updates) and a
# fresh controller (10,000 updates) on the milestone's frozen denoiser and replay.
defaults:
  - env: dm_control  # env.train is replaced by the milestone's
  - agent: pmpo_beta  # agent.denoiser is replaced by the milestone's; reward model and PMPO are fresh
  - override hydra/job_logging: stdout
  - _self_  # last, so the explicit downstream controller settings below take precedence

# Downstream controller: the Gaussian H10 EMA-critic controller of config/agent/pmpo_beta.yaml (repeat-frame
# imagined resets, EMA critic regularization) with the sign-only PMPO objective, stated explicitly
# (the learned exploration presets use advantage_weighted).
agent:
  actor_critic:
    actor_objective: sign

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: False

initialization:
  milestone_path: ???
  # Launcher-level (exactly one of the two): every milestone in this folder. Removed before a trainer
  # sees the configuration, so each run's saved config names only its own milestone_path.
  milestones_dir: null
  # Launcher-level, folder mode only: adapt just the milestones whose manifest collected_steps is listed
  # (distinct positive integers, run in ascending step order; every one must exist). null: all of them.
  # Removed before a trainer sees the configuration, like milestones_dir.
  milestone_steps: null
  # Ensemble milestones hold several denoisers; this one (fixed in advance, never chosen by
  # evaluation results) is loaded as the frozen denoiser. Single-model milestones: only 0.
  member_index: 0

downstream:
  task_name: ???
  seed: 0
  mode: train  # src/downstream_main.py: train | resume | evaluate; src/downstream_analysis.py: collect | compare

common:
  devices: 0  # GPU index or cpu
  seed: ${downstream.seed}  # read by agent.actor_critic.seed

# Results (downstream.mode=collect | compare; CPU only, nothing is trained or evaluated; the task, adaptation seed
# and initialization.member_index select the outputs):
#   collect: python src/downstream_analysis.py downstream.mode=collect analysis.run_dir=<exploration run> \
#                downstream.task_name=walk downstream.seed=0   -> <run>/result/<task>/seed_<s>/result.csv
#   compare: python src/downstream_analysis.py downstream.mode=compare analysis.domain=walker analysis.exploration_seed=0 \
#                downstream.task_name=walk downstream.seed=0
#            -> <output_root>/comparisons/<domain>/exploration_seed_<N>/<task>/adaptation_seed_<s>/
analysis:
  run_dir: null  # collect: the exploration run folder
  output_root: outputs  # compare: holds <method>/<domain>/seed_<N>/ runs (custom output roots: pending)
  domain: null
  exploration_seed: null
  protocol: null  # evaluation protocol id (eval_*_protocol-<id>.json), required when several exist

# W&B: disabled (default) | offline | online. One run per exploration run x task x adaptation seed x denoiser member,
# shared by every milestone adapted for them (all of a folder, a milestone_steps selection or one milestone_path;
# later commands join it). Its identity and publication state are in <run>/downstream/wandb_<task>_seed_<s>[_member_<k>].json:
# the folder launcher prepares it (no run of its own) and each milestone's process attaches in turn; every
# adaptation stays independent. Evaluation points count as published only when the server's history shows them;
# missing ones are logged again by the next attachment. A resume continues the shared run; evaluate-only adds a
# point to it. Logging settings may change on resume; they change no training.
wandb:
  mode: disabled
  project: null  # the launchers use one project per task group and task: <prefix>-<group>-<task>
  entity: null
  name: null  # used exactly; null: <method>-<domain>-exploration-seed<N>-<task>-adaptation-seed<s>[-member<k>]
  group: null  # used exactly; null: the run name
  tags: null
  notes: null

world_model_env:
  _target_: envs.WorldModelEnvConfig
  horizon: 10  # imagination horizon of the Gaussian H10 EMA-critic controller (reference H10 runs)
  num_batches_to_preload: 256
  diffusion_sampler:
    _target_: models.diffusion.DiffusionSamplerConfig
    num_steps_denoising: 3
    sigma_min: 2e-3
    sigma_max: 5.0
    rho: 7
    order: 1
    s_churn: 0.0
    s_tmin: 0.0
    s_tmax: ${eval:'float("inf")'}
    s_noise: 1.0

# Resumable checkpoints at completed updates, at the phase transition and at the end.
checkpointing:
  every: 100  # updates within a phase (null: only at the phase transition and the end)

# Real-task evaluation of the final policy (deterministic actions; never trains or stores).
evaluation:
  after_training: True
  seeds: [3001, 3002, 3003, 3004, 3005, 3006, 3007, 3008, 3009, 3010, 3011, 3012, 3013, 3014, 3015,
          3016, 3017, 3018, 3019, 3020, 3021, 3022, 3023, 3024, 3025, 3026, 3027, 3028, 3029, 3030]  # 30-seed protocol
  max_steps: 500  # environment steps per episode (x action_repeat control steps)

# Phase 1: reward/end model on the selected task's recorded rewards.
rew_end_model:
  # W&B diagnostics only (reward_model/train/debug/: loss_total, loss_end, grad_norm, prediction_mae);
  # the end head is trained as before either way.
  debug_metrics: false
  training:
    steps: 5000
    batch_size: 32
    # 19 = the reference H10 runs' rew_end_model.training.seq_length override (the H15 value
    # 15 + 4 conditioning frames, kept when they moved to horizon 10).
    seq_length: 19
    sample_weights: null  # episodes by length, anchor step uniform within the episode
    lr_warmup_steps: 100
    max_grad_norm: 100.0
  optimizer:
    lr: 1e-4
    weight_decay: 1e-2
    eps: 1e-8

# Phase 2: PMPO in imagination on predicted task reward (reward model frozen).
actor_critic:
  training:
    steps: 10000
    batch_size: 32
    sample_weights: null
    lr_warmup_steps: 100
