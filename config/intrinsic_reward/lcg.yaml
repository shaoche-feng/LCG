# LCG intrinsic-reward lifecycle, the scorer for learned exploration. ExplorationTrainer
# requires `enabled: True` when collection.train.mode=policy and `enabled: False` for the
# uniform baseline (collection.train.mode=uniform). Other values are read only when enabled.
#
# This is a config GROUP (config/intrinsic_reward/), selected via exploration.yaml's
# `defaults: - intrinsic_reward: lcg`, so a future baseline (RND, ICM, ...) can be added
# as a sibling file (config/intrinsic_reward/rnd.yaml, ...) and swapped in the same way,
# instead of accumulating multiple mutually-exclusive top-level `enabled` blocks.
#
# The method: historical precision h_D is a backward/VJP diagonal Gauss-Newton estimate
# with simple IID Monte Carlo sigma sampling (precision_num_mc draws per historical
# transition, over a uniform-without-replacement subset of the replay). The candidate
# intrinsic reward is a forward-mode JVP estimate, also simple IID Monte Carlo
# (candidate_num_mc draws per candidate), with Full CRN (every candidate in a scoring
# batch shares the same (sigma, eps, eps_offset, eta) per MC sample). There is no
# alternative estimator to select -- this is the only candidate-scoring backend.
_target_: intrinsic_reward.lcg.LCGConfig

enabled: True

theta_s:
  _target_: intrinsic_reward.lcg.theta_s.ThetaSConfig
  # theta_S = the final decoder level's ResBlocks + output norm + output conv (d_S=654,851
  # under the current agent.denoiser.inner_model.depths=[2,2,2,2] architecture -- "3" below
  # is that architecture's last u_block index, confirmed by inspecting the real model, not
  # assumed). Change theta_s here (YAML only, no Python) to ablate which coordinates LCG's
  # curvature estimate covers -- see tests/lcg/test_theta_s.py for worked examples
  # (conv_out-only, norm_out+conv_out, broad-include-with-exclude, ...).
  include:
    - "unet.u_blocks.3.*"
    - "norm_out.*"
    - "conv_out.*"
  exclude: []
  # Optional guards: fail if the selection does not have exactly this many tensors/scalars.
  expected_num_tensors: null
  expected_dim: null

precision_reference_size: 320
precision_num_mc: 3
damping: 1e-4
beta: 1.0

# Policy reward from raw LCG scores: rms (RunningRMS below), fixed (raw / fixed_divisor, no
# running statistics, centering or clipping), none, data_scaled (replay-size correction), or
# reference (a frozen mean raw score of uniform-action imagination per refresh; see docs/REWARD_SCALING.md).
# Must agree with rms_enabled (true only
# for rms); a config without reward_scaling means rms if rms_enabled else none.
reward_scaling: rms
fixed_divisor: null
data_reference_steps: null
reference_num_prompts: null

rms_enabled: True
rms_alpha: 1.0
rms_ema_decay: 0.99
rms_eps: 1e-8

candidate_num_mc: 12 #16, 24
# 16 was benchmarked as the fastest AND lowest-memory candidate chunk size among C in
# {4,8,16,32,64,96,128,240} at M=12 (22.9s/480 candidates, 958MB peak reserved on an
# 8GB laptop GPU); C=240 hit a genuine GPU-memory cliff and was slower than C=4.
candidate_chunk_size: 16
