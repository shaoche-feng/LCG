defaults:
  - _self_
  - env: atari
  - agent: drq
  - intrinsic_reward: lcg


hydra:
  job:
    chdir: True

wandb:
  mode: disabled
  project: null
  entity: null
  name: null
  group: null
  tags: null
  notes: null

initialization:
  path_to_ckpt: null
  load_denoiser: True
  load_rew_end_model: True
  load_actor_critic: True

common:
  devices: 0  # int, list of int, cpu, or all 
  seed: null
  deterministic_cuda: false  # experimental: opt-in cudnn.deterministic/benchmark, see trainer.py
  resume: False # do not modify, set by scripts/resume.sh only.

checkpointing:
  save_agent_every: 5
  num_to_keep: 11  # number of checkpoints to keep, use null to disable
  save_dataset_manifest: false  # experimental: per-episode sha256 + length-integrity manifest each save, see trainer.py

collection:
  train:
    num_envs: 1
    epsilon: 0.01
    num_steps_total: 100000
    first_epoch:
      # min: for discrete/Atari agents (RewEndModel.continuous_reward=False), the collection
      # floor before the reward-class-balance heuristic below is even consulted. For
      # continuous-reward agents (e.g. DM Control), min is used directly and *only* as the
      # initial-collection step budget: collection stops as soon as num_steps >= min, and
      # max/threshold_rew below are not used at all (see Trainer.collect_initial_dataset).
      min: 5000
      max: 10000  # null: no maximum. Atari-only.
      threshold_rew: 10  # Atari-only.
    steps_per_epoch: 100
  test:
    num_envs: 1
    num_episodes: 4
    epsilon: 0.0
    num_final_episodes: 100

static_dataset:
  path: null  # if specified, will disable train/test data collection
  ignore_sample_weights: True

training:
  should: True
  num_final_epochs: 50
  cache_in_ram: True
  num_workers_data_loaders: 0
  model_free: False # if True, turn off world_model training and RL in imagination
  compile_wm: True

evaluation:
  should: True
  every: 10

world_model_env:
  _target_: envs.WorldModelEnvConfig
  horizon: 15
  num_batches_to_preload: 256
  diffusion_sampler:
    _target_: models.diffusion.DiffusionSamplerConfig
    num_steps_denoising: 3
    sigma_min: 2e-3
    sigma_max: 5.0
    rho: 7
    order: 1  # 1: Euler, 2: Heun
    s_churn: 0.0  # Amount of stochasticity
    s_tmin: 0.0
    s_tmax: ${eval:'float("inf")'}
    s_noise: 1.0

denoiser:
  training:
    num_autoregressive_steps: 1
    start_after_epochs: 0
    steps_first_epoch: 10000
    steps_per_epoch: 400
    sample_weights: [0.1, 0.1, 0.1, 0.7]
    batch_size: 32
    grad_acc_steps: 1
    lr_warmup_steps: 100
    max_grad_norm: 1.0

  optimizer:
    lr: 1e-4
    weight_decay: 1e-2
    eps: 1e-8
  
  sigma_distribution: # log normal distribution for sigma during training
    _target_: models.diffusion.SigmaDistributionConfig
    loc: -0.4
    scale: 1.2
    sigma_min: 2e-3
    sigma_max: 20

rew_end_model:
  training:
    seq_length: ${eval:'${world_model_env.horizon} + ${agent.denoiser.inner_model.num_steps_conditioning}'}
    start_after_epochs: 0
    steps_first_epoch: 10000
    steps_per_epoch: 400
    sample_weights: ${denoiser.training.sample_weights}
    batch_size: 32
    grad_acc_steps: 1
    lr_warmup_steps: 100
    max_grad_norm: 100.0

  optimizer:
    lr: 1e-4
    weight_decay: 1e-2
    eps: 1e-8

actor_critic:
  training:
    sample_weights: ${denoiser.training.sample_weights}
    batch_size: 32
    grad_acc_steps: 1
    start_after_epochs: 0
    steps_first_epoch: 5000
    steps_per_epoch: 400
    lr_warmup_steps: 100
    max_grad_norm: 100.0

  actor_critic_loss:
    _target_: models.actor_critic.ActorCriticLossConfig
    backup_every: 15
    gamma: 0.985
    lambda_: 0.95
    weight_value_loss: 1.0
    weight_entropy_loss: 0.001

  optimizer:
    lr: 1e-4
    weight_decay: 0
    eps: 1e-8

# DrQActorCritic-specific training config, read instead of the actor_critic.actor_critic_loss/
# optimizer sections above whenever agent.actor_critic resolves to a DrQActorCriticConfig (see
# config/agent/drq.yaml and Trainer.__init__'s self._is_drq branch). actor_critic.training
# above (steps_per_epoch/batch_size/sample_weights/start_after_epochs/lr_warmup_steps/...) is
# still shared by both -- it drives the WorldModelEnv imagined-rollout batch construction and
# training cadence, which doesn't depend on which actor-critic consumes it (grad_acc_steps and
# max_grad_norm specifically are NOT read for DrQ -- see train_drq_actor_critic's docstring).
drq:
  loss:
    _target_: models.drq_actor_critic.DrQLossConfig
    backup_every: 8  # rollout length per env_loop.send() call, i.e. per collect_rollout()
    n_step: 3
    gamma: 0.985  # matches actor_critic.actor_critic_loss.gamma above
    target_tau: 0.01
    noise_clip: 0.3
    critic_max_grad_norm: 100.0
    actor_max_grad_norm: 100.0

  critic_optimizer:
    lr: 1e-4
    weight_decay: 0
    eps: 1e-8

  actor_optimizer:
    lr: 1e-4
    weight_decay: 0
    eps: 1e-8

# LCG intrinsic-reward lifecycle config now lives in config/intrinsic_reward/lcg.yaml
# (a Hydra config group, selected above via `defaults: - intrinsic_reward: lcg`), so a
# future baseline (RND, ICM, ...) can be added as a sibling file and swapped in the same
# way. Access as cfg.intrinsic_reward.* (was cfg.lcg.*).
